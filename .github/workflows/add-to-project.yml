name: Add Issues and PRs to Project

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add to Neural Tools Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          # Replace YOUR_PROJECT_NUMBER with your actual project number
          # Find it in your project URL: github.com/users/MacLeanLuke/projects/NUMBER
          project-url: https://github.com/users/MacLeanLuke/projects/YOUR_PROJECT_NUMBER
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labeled: bug, enhancement, documentation
          label-operator: OR
