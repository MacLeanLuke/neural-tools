name: Setup WWW Redirect

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - update
          - remove

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: neural-tools-www-redirect

jobs:
  setup-redirect:
    name: Setup CloudFront Redirect Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity

      - name: Check if function exists
        id: check_function
        run: |
          FUNCTION_ARN=$(aws cloudfront list-functions \
            --query "FunctionList.Items[?Name=='${{ env.FUNCTION_NAME }}'].FunctionMetadata.FunctionARN" \
            --output text 2>/dev/null || echo "")

          if [ -z "$FUNCTION_ARN" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Function does not exist"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT
            echo "Function exists: $FUNCTION_ARN"
          fi

      - name: Create CloudFront Function
        if: steps.check_function.outputs.exists == 'false' && github.event.inputs.operation != 'remove'
        id: create_function
        run: |
          echo "Creating CloudFront Function..."

          CREATE_OUTPUT=$(aws cloudfront create-function \
            --name "${{ env.FUNCTION_NAME }}" \
            --function-config Comment="Redirect apex domain to www subdomain",Runtime=cloudfront-js-2.0 \
            --function-code fileb://website/cloudfront-function-redirect.js)

          FUNCTION_ARN=$(echo "$CREATE_OUTPUT" | jq -r '.FunctionSummary.FunctionMetadata.FunctionARN')
          ETAG=$(echo "$CREATE_OUTPUT" | jq -r '.ETag')

          echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT
          echo "etag=$ETAG" >> $GITHUB_OUTPUT
          echo "✅ Function created: $FUNCTION_ARN"

      - name: Update CloudFront Function
        if: steps.check_function.outputs.exists == 'true' && github.event.inputs.operation != 'remove'
        id: update_function
        run: |
          echo "Updating CloudFront Function..."

          # Get current ETag
          DESCRIBE_OUTPUT=$(aws cloudfront describe-function --name "${{ env.FUNCTION_NAME }}")
          CURRENT_ETAG=$(echo "$DESCRIBE_OUTPUT" | jq -r '.ETag')

          # Update function code
          UPDATE_OUTPUT=$(aws cloudfront update-function \
            --name "${{ env.FUNCTION_NAME }}" \
            --function-config Comment="Redirect apex domain to www subdomain",Runtime=cloudfront-js-2.0 \
            --function-code fileb://website/cloudfront-function-redirect.js \
            --if-match "$CURRENT_ETAG")

          FUNCTION_ARN=$(echo "$UPDATE_OUTPUT" | jq -r '.FunctionSummary.FunctionMetadata.FunctionARN')
          ETAG=$(echo "$UPDATE_OUTPUT" | jq -r '.ETag')

          echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT
          echo "etag=$ETAG" >> $GITHUB_OUTPUT
          echo "✅ Function updated: $FUNCTION_ARN"

      - name: Publish CloudFront Function
        if: github.event.inputs.operation != 'remove'
        id: publish_function
        run: |
          echo "Publishing CloudFront Function..."

          # Use the ETag from create or update step
          if [ "${{ steps.check_function.outputs.exists }}" == "false" ]; then
            ETAG="${{ steps.create_function.outputs.etag }}"
            FUNCTION_ARN="${{ steps.create_function.outputs.function_arn }}"
          else
            ETAG="${{ steps.update_function.outputs.etag }}"
            FUNCTION_ARN="${{ steps.update_function.outputs.function_arn }}"
          fi

          PUBLISH_OUTPUT=$(aws cloudfront publish-function \
            --name "${{ env.FUNCTION_NAME }}" \
            --if-match "$ETAG")

          PUBLISH_ETAG=$(echo "$PUBLISH_OUTPUT" | jq -r '.ETag')

          echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT
          echo "✅ Function published"

      - name: Attach function to CloudFront distribution
        if: github.event.inputs.operation != 'remove'
        run: |
          echo "Attaching function to CloudFront distribution..."

          DISTRIBUTION_ID="${{ secrets.AWS_CLOUDFRONT_ID }}"
          FUNCTION_ARN="${{ steps.publish_function.outputs.function_arn }}"

          # Get current distribution config
          aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --output json > /tmp/cloudfront-dist-config.json

          DIST_ETAG=$(jq -r '.ETag' /tmp/cloudfront-dist-config.json)

          # Update distribution to add function association
          jq --arg func_arn "$FUNCTION_ARN" '
            .DistributionConfig.DefaultCacheBehavior.FunctionAssociations = {
              "Quantity": 1,
              "Items": [
                {
                  "FunctionARN": $func_arn,
                  "EventType": "viewer-request"
                }
              ]
            }
          ' /tmp/cloudfront-dist-config.json | jq '.DistributionConfig' > /tmp/cloudfront-dist-config-updated.json

          # Update the distribution
          aws cloudfront update-distribution \
            --id "$DISTRIBUTION_ID" \
            --distribution-config file:///tmp/cloudfront-dist-config-updated.json \
            --if-match "$DIST_ETAG" \
            --output json > /tmp/cloudfront-update-result.json

          echo "✅ Function attached to distribution $DISTRIBUTION_ID"

      - name: Remove function from CloudFront distribution
        if: github.event.inputs.operation == 'remove'
        run: |
          echo "Removing function from CloudFront distribution..."

          DISTRIBUTION_ID="${{ secrets.AWS_CLOUDFRONT_ID }}"

          # Get current distribution config
          aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --output json > /tmp/cloudfront-dist-config.json

          DIST_ETAG=$(jq -r '.ETag' /tmp/cloudfront-dist-config.json)

          # Remove function association
          jq '.DistributionConfig.DefaultCacheBehavior.FunctionAssociations = {
            "Quantity": 0
          }' /tmp/cloudfront-dist-config.json | jq '.DistributionConfig' > /tmp/cloudfront-dist-config-updated.json

          # Update the distribution
          aws cloudfront update-distribution \
            --id "$DISTRIBUTION_ID" \
            --distribution-config file:///tmp/cloudfront-dist-config-updated.json \
            --if-match "$DIST_ETAG" \
            --output json > /tmp/cloudfront-update-result.json

          echo "✅ Function removed from distribution $DISTRIBUTION_ID"

      - name: Get deployment status
        run: |
          DISTRIBUTION_ID="${{ secrets.AWS_CLOUDFRONT_ID }}"
          STATUS=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.Status' --output text)
          echo "CloudFront Distribution Status: $STATUS"

      - name: Deployment summary
        if: github.event.inputs.operation != 'remove'
        run: |
          echo "## 🎉 WWW Redirect Setup Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- **Function Name:** \`${{ env.FUNCTION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution ID:** \`${{ secrets.AWS_CLOUDFRONT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event Type:** viewer-request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How it works:" >> $GITHUB_STEP_SUMMARY
          echo "- Requests to \`https://neural-tools.com/*\` will redirect to \`https://www.neural-tools.com/*\`" >> $GITHUB_STEP_SUMMARY
          echo "- HTTP Status: **301 Moved Permanently**" >> $GITHUB_STEP_SUMMARY
          echo "- Query strings and paths are preserved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Testing:" >> $GITHUB_STEP_SUMMARY
          echo "Wait 5-15 minutes for CloudFront to deploy, then test:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "curl -I https://neural-tools.com" >> $GITHUB_STEP_SUMMARY
          echo "# Should return: HTTP/2 301" >> $GITHUB_STEP_SUMMARY
          echo "# Location: https://www.neural-tools.com/" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Visit [https://neural-tools.com](https://neural-tools.com) to test the redirect" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Setup completed at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Removal summary
        if: github.event.inputs.operation == 'remove'
        run: |
          echo "## 🗑️ WWW Redirect Removed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The redirect function has been removed from the CloudFront distribution." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** The function itself still exists and can be re-attached using the 'deploy' operation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Removal completed at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Notify status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Operation completed successfully!"
          else
            echo "❌ Operation failed. Check logs above."
            exit 1
          fi
