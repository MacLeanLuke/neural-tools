name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm -r lint` already skips packages that define no lint script, so a
      # failure here is a real failure. This step used to end in
      # `|| echo "Linting not configured yet"`, which swallowed every lint error
      # and made the check decorative.
      - name: Lint
        run: pnpm lint

      # core must be built before cli can typecheck against it.
      - name: Build
        run: pnpm build

      # Reaches packages/cli's 22 Vitest cases. pnpm -r propagates a non-zero
      # exit, so a failing test fails the build.
      - name: Test
        run: pnpm test
